# Rules are listed in the order the compiler applies them: 
# - first what a format admits, 
# -- then what it removes, 
# --- then how many copies survive, 
# ---- then the whole-deck size check.

set_allow:  # set ids admitted;
            # "*" means every set;
            # Empty admits nothing.
  type: list
  required: false
  nullable: true
  schema:
    type: string
    coerce: str

regulation_allow: # regulation marks admitted;
                  # "*" means every mark;
                  # Empty admits nothing.
  type: list
  required: false
  nullable: true
  schema:
    type: string
    coerce: str

blueprint_ban: # Blueprint ids banned outright.
            # Checked before blueprint_restrict and wins over it: a banned blueprint
            # is never legal, whatever else names it.
  type: list
  required: false
  nullable: true
  schema:
    type: string

blueprint_restrict:  # Blueprint id to the copies a deck may hold;
                  # Overrides blueprint_exception and blueprint_limit, but not blueprint_ban.
                  # This occurs when designers don't want to outright ban an blueprint.
  type: dict
  required: false
  nullable: true
  valuesrules:
    type: integer
    min: 0

blueprint_exception: # A category or trait value, to the copies a deck may hold of
                  # any blueprint carrying it. Overrides blueprint_limit, and is itself
                  # overridden by blueprint_restrict.
                  # Flat because the two vocabularies are kept disjoint: a trait
                  # never reuses a category's name. Nothing enforces that at
                  # compile time, so keep it in mind when adding a trait.
                  # Here it caps the hero slot, which allows a single card.
  type: dict
  required: false
  nullable: true
  valuesrules:
    type: integer
    min: 0

blueprint_limit: # Copies of any one blueprint a deck may hold.
              # The default, applied when nothing more specific above matched.
  type: integer
  required: false
  min: 1

list_limit: # Total cards per list-group required to qualify as format legal.
            # Keyed by the deck list zone, so the rules nest one level down.
            # Non-declared values will be interpretted as 0. 
            # An absent zone admits no cards, and an absent bound is unenforced at that end.
  type: dict
  required: false
  nullable: true
  keysrules:
    type: string
    allowed: ['hero', 'main', 'side', 'auxiliary']
  valuesrules:
    type: dict
    schema:
      minimum:
        type: integer
        required: false
        nullable: true
        min: 0
      maximum:
        type: integer
        required: false
        nullable: true
        min: 0