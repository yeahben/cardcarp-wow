  - type: Ability
    position: Reverse
    text: Essence of Anger has +X ATK while attacking, where X is 5 plus the number of anger counters.
  - type: Ability
    position: Reverse
    text: Remove an anger counter → Essence of Anger deals 1 melee damage to target ally.

