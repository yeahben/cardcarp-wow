    position: Reverse
    text: Shade of Akama has +3 ATK while attacking.
  - type: Ability
    position: Reverse
    text: At the start of your turn, choose an opposing hero. Shade of Akama has an additional +3 ATK while attacking that hero this turn. When that hero is destroyed this turn, destroy all opposing heroes.

