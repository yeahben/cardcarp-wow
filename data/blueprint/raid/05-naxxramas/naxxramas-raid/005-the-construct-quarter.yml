instant: false

rule:
  - type: Ability
    position: Front
    text: At the end of your turn, if the Boss is face up and not Immune, add a rage counter. Then, if there are three or more, flip the Boss.
  - type: Ability
    position: Front
    text: 'On your turn: {activate} → Put a Mortal Wound from your graveyard into your hand.'
  - type: Ability
    position: Front
    text: When a Boss is destroyed, remove all rage counters and destroy all Naxxramas tokens.
  - type: Ability
    position: Front
    text: When Thaddius is destroyed, flip this card.
  - type: Ability
    position: Reverse
    text: When this card flips to this side, say "Fools, you think yourselves triumphant? You have only taken one step closer to the abyss!"
  - type: Ability
    position: Reverse
    text: At the end of the raid leader's turn, add a rage counter if there are less than three.
  - type: Ability
    position: Reverse
    text: 'Any raider: Remove three rage counters → Turn all raiding heroes face up.'

